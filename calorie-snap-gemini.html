<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แคลอรี่สแนป</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4ff;--card:#fff;--ink:#12304f;--sub:#5f7c9a;--main:#2f8cff;--deep:#1565d8;--soft:#d6e9ff;--line:#cfe2f7;--warn:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0d1b2e;--card:#142843;--ink:#e6f1ff;--sub:#8fb0d4;--soft:#1c3a5e;--line:#244a75}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt',system-ui,sans-serif;padding:16px 16px 40px}
.wrap{max-width:480px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px;font-weight:600}
.hero{background:linear-gradient(150deg,var(--main),var(--deep));color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden}
.hero small{opacity:.85}
.big{font-size:54px;font-weight:600;line-height:1.1}
.big span{font-size:18px;font-weight:400;opacity:.85}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;width:0;transition:width .5s}
.goal{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;opacity:.95}
.goal button{background:none;border:0;color:#fff;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.card{background:var(--card);border-radius:22px;padding:16px;margin-top:14px;border:1px solid var(--line)}
.snap{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px dashed var(--main);background:var(--soft);color:var(--deep);border-radius:20px;padding:22px;font:600 17px 'Prompt';cursor:pointer}
.snap:hover{background:var(--card)}
#preview{width:100%;max-height:260px;object-fit:cover;border-radius:16px;display:none;margin-bottom:12px}
.status{color:var(--sub);text-align:center;padding:10px;font-size:15px}
.spin{width:22px;height:22px;border:3px solid var(--soft);border-top-color:var(--main);border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
input[type=text],input[type=number],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:inherit;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.num{width:92px!important;text-align:right}
.btn{background:var(--main);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:600 15px 'Prompt';cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--deep)}
.btn.full{width:100%;margin-top:12px}
.total{display:flex;justify-content:space-between;font-weight:600;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.meal{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border:0}
.meal img{width:58px;height:58px;border-radius:14px;object-fit:cover;flex:none}
.meal .t{flex:1;min-width:0}
.meal .t b{display:block;font-weight:500}
.meal .t small{color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcal{font-weight:600;color:var(--deep);white-space:nowrap}
.del{background:none;border:0;color:var(--sub);font-size:20px;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.empty{color:var(--sub);text-align:center;padding:18px 0}
.err{color:var(--warn);text-align:center;padding:8px;font-size:14px}
details summary{cursor:pointer;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍜 แคลอรี่สแนป</h1>

  <div class="nav" style="margin:0 0 10px">
    <button id="prev" aria-label="วันก่อนหน้า">‹</button>
    <b id="dateLabel"></b>
    <button id="next" aria-label="วันถัดไป">›</button>
  </div>

  <section class="hero">
    <small id="heroLabel">วันนี้คุณได้รับแล้ว</small>
    <div class="big"><span id="sum">0</span> <span>กิโลแคลอรี่</span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="goal"><span id="left"></span><button id="goalBtn">เป้าหมาย <span id="goalVal">2000</span> kcal</button></div>
  </section>

  <section class="card" id="addCard">
    <img id="preview" alt="รูปอาหาร">
    <label class="snap" id="snapLbl">📷 ถ่ายรูปอาหาร / เลือกรูป
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
    </label>
    <div id="status"></div>
    <div id="result" hidden>
      <div id="items"></div>
      <div class="total"><span>รวมมื้อนี้</span><span><span id="mealTotal">0</span> kcal</span></div>
      <button class="btn full" id="save">บันทึกมื้อนี้</button>
      <button class="btn ghost full" id="cancel">ยกเลิก</button>
    </div>
  </section>

  <section class="card">
    <b>อาหารที่กินวันนี้</b>
    <div id="list"></div>
  </section>

  <section class="card">
    <details id="keyBox">
      <summary>ตั้งค่า Gemini API Key</summary>
      <div class="row"><input type="password" id="key" placeholder="AIza..." autocomplete="off"><button class="btn" id="keySave">เก็บ</button></div>
      <small style="color:var(--sub);display:block;margin-top:8px">ขอคีย์ฟรีที่ aistudio.google.com แล้วกด Get API key<br>คีย์จะถูกเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ใช้ส่วนตัวเท่านั้น อย่านำไฟล์นี้ไปเผยแพร่พร้อมคีย์</small>
    </details>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('พื้นที่เก็บข้อมูลเต็ม ลองลบรายการเก่า')}}};
const MODEL='gemini-3.8-flash';
let day=new Date(), pending=null, imgData='';

const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const isToday=()=>dkey(day)===dkey(new Date());
const meals=()=>LS.get('meals',{});

function render(){
  const all=meals(), list=all[dkey(day)]||[];
  const sum=list.reduce((a,m)=>a+m.kcal,0), goal=LS.get('goal',2000);
  $('dateLabel').textContent=isToday()?'วันนี้':day.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('heroLabel').textContent=isToday()?'วันนี้คุณได้รับแล้ว':'วันนี้ได้รับไป';
  $('sum').textContent=sum.toLocaleString();
  $('goalVal').textContent=goal;
  $('fill').style.width=Math.min(100,sum/goal*100)+'%';
  $('left').textContent=sum<=goal?`เหลืออีก ${(goal-sum).toLocaleString()} kcal`:`เกินเป้า ${(sum-goal).toLocaleString()} kcal`;
  $('next').disabled=isToday();
  $('list').innerHTML=list.length?list.map((m,i)=>`<div class="meal">${m.img?`<img src="${m.img}" alt="">`:''}<div class="t"><b>${esc(m.items.map(x=>x.name).join(', '))}</b><small>${m.time}</small></div><div class="kcal">${m.kcal}</div><button class="del" data-i="${i}" aria-label="ลบ">×</button></div>`).join(''):'<div class="empty">ยังไม่มีรายการ — ถ่ายรูปมื้อแรกได้เลย</div>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resize(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}

$('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const key=LS.get('apikey','');
  if(!key){$('keyBox').open=true;$('status').innerHTML='<div class="err">กรุณาใส่ Gemini API Key ด้านล่างก่อน</div>';return}
  try{
    imgData=await resize(f,768,.8);
    const thumb=await resize(f,160,.6);
    $('preview').src=imgData;$('preview').style.display='block';
    $('snapLbl').hidden=true;$('result').hidden=true;
    $('status').innerHTML='<div class="status"><span class="spin"></span>AI กำลังดูอาหารของคุณ...</div>';
    const sys='คุณคือนักโภชนาการ วิเคราะห์รูปอาหาร แล้วตอบเป็น JSON เท่านั้นในรูปแบบ {"items":[{"name":"ชื่อเมนูภาษาไทย","kcal":จำนวนเต็ม}]} โดยประมาณแคลอรี่ตามปริมาณที่เห็นในรูป แยกเป็นรายเมนู ถ้าไม่ใช่อาหารให้ตอบ {"items":[]}';
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      systemInstruction:{parts:[{text:sys}]},
      contents:[{parts:[{text:'อาหารในรูปนี้คืออะไร กี่แคลอรี่'},{inline_data:{mime_type:'image/jpeg',data:imgData.split(',')[1]}}]}],
      generationConfig:{responseMimeType:'application/json'}})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error&&j.error.message||'เรียก API ไม่สำเร็จ');
    const items=(JSON.parse(j.candidates[0].content.parts[0].text).items||[]).map(x=>({name:String(x.name),kcal:Math.round(+x.kcal)||0}));
    if(!items.length){$('status').innerHTML='<div class="err">ไม่พบอาหารในรูป ลองถ่ายใหม่อีกครั้ง</div>';reset(true);return}
    pending={items,thumb};$('status').innerHTML='';showResult();
  }catch(err){$('status').innerHTML=`<div class="err">${esc(err.message)}</div>`;reset(true)}
  e.target.value='';
};

function showResult(){
  $('items').innerHTML=pending.items.map((x,i)=>`<div class="row"><input type="text" value="${esc(x.name)}" data-n="${i}"><input class="num" type="number" min="0" value="${x.kcal}" data-k="${i}"></div>`).join('');
  $('result').hidden=false;calc();
}
function calc(){$('mealTotal').textContent=pending.items.reduce((a,x)=>a+(+x.kcal||0),0)}
$('items').oninput=e=>{const t=e.target;if(t.dataset.n!=null)pending.items[t.dataset.n].name=t.value;if(t.dataset.k!=null){pending.items[t.dataset.k].kcal=+t.value||0;calc()}};
function reset(keepStatus){pending=null;$('result').hidden=true;$('preview').style.display='none';$('snapLbl').hidden=false;if(!keepStatus)$('status').innerHTML=''}
$('cancel').onclick=()=>reset();
$('save').onclick=()=>{
  const all=meals(),k=dkey(day);(all[k]=all[k]||[]).push({items:pending.items,kcal:pending.items.reduce((a,x)=>a+(+x.kcal||0),0),img:pending.thumb,time:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})});
  LS.set('meals',all);reset();render();
};
$('list').onclick=e=>{const b=e.target.closest('.del');if(!b)return;if(!confirm('ลบรายการนี้?'))return;const all=meals();all[dkey(day)].splice(+b.dataset.i,1);LS.set('meals',all);render()};
$('prev').onclick=()=>{day.setDate(day.getDate()-1);render()};
$('next').onclick=()=>{day.setDate(day.getDate()+1);render()};
$('goalBtn').onclick=()=>{const v=parseInt(prompt('ตั้งเป้าหมายแคลอรี่ต่อวัน (kcal)',LS.get('goal',2000)));if(v>0){LS.set('goal',v);render()}};
$('keySave').onclick=()=>{LS.set('apikey',$('key').value.trim());$('key').value='';$('keyBox').open=false;$('status').innerHTML=''};
render();
</script>
</body>
</html>
